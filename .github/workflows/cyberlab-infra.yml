name: Pipeline Cyberlab Infra

# Deploiement des backends cyberlab (cyberlab/docker-compose.yml), depot separe du
# depot HomeServer-monitoring : un changement de l'un ne redemarre
# jamais l'autre.
# Les images des backends sont publiees et signees par la CI de chaque depot
# (GHCR) ; une PR automatique y reporte le digest dans le compose. Ce pipeline
# verifie les signatures (job ②, puis playbook) avant tout deploiement.
on:
  # Les PR sont controlees (lint + securite) avant merge ; seul un push sur main
  # ou un declenchement manuel deploie.
  pull_request:
    branches: [main]
    paths:
      - 'cyberlab/**'
      - 'ansible/playbooks/deploy-cyberlab.yml'
      - '.github/workflows/cyberlab-infra.yml'
  push:
    branches: [main]
    paths:
      - 'cyberlab/**'
      - 'ansible/playbooks/deploy-cyberlab.yml'
      - '.github/workflows/cyberlab-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cyberlab-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Workspace distinct de celui du pipeline monitoring (autre depot) : les deux workflows
  # peuvent tourner en meme temps sur le runner sans s'ecraser. Chaque job
  # travaille dans son propre sous-dossier (defini au niveau du job) : lint et
  # securite tournent en parallele sans s'ecraser.
  WORKSPACE: /volume2/docker/workspace_cyberlab
  WORKSPACE_PARENT: /volume2/docker
  TARBALL_URL: https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}
  COSIGN_IMAGE: gcr.io/projectsigstore/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
  ALPINE_IMAGE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Lint (yamllint + ansible-lint)
  # ─────────────────────────────────────────
  lint:
    name: "① Code Quality"
    runs-on: self-hosted
    # Runner auto-heberge sur un depot public : on n'execute jamais le code d'une PR
    # venant d'un fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    env:
      WORKSPACE: /volume2/docker/workspace_cyberlab/lint-${{ github.run_id }}
    steps:
      # Via démon hôte : le conteneur du runner ne voit pas le même montage
      - name: Nettoyage du répertoire (via démon hôte)
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            sh -c "mkdir -p '$WORKSPACE' && rm -rf '$WORKSPACE'/*"

      - name: Récupération du code
        run: |
          cd "$WORKSPACE"
          CURL_CFG=$(mktemp)
          chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.MY_GITHUB_TOKEN }}" > "$CURL_CFG"
          curl -f -L -K "$CURL_CFG" "$TARBALL_URL" -o repo.tar.gz
          rm -f "$CURL_CFG"
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: yamllint
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            pipelinecomponents/yamllint:0.35.27@sha256:f7f7b4f8824839e33690a880dbe20944128b0dc9c55522a0b92a29b3a905cecf \
            yamllint -c /workspace/.yamllint.yml /workspace/cyberlab /workspace/ansible/playbooks/deploy-cyberlab.yml --strict

      - name: ansible-lint
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            pipelinecomponents/ansible-lint:0.79.38@sha256:1c4d2abd372a2dce7ea1cb8e27b650db809115d410a87a4aba2438bd028de735 \
            ansible-lint /workspace/ansible/playbooks/deploy-cyberlab.yml --profile=production

      - name: Nettoyage final du workspace (via démon hôte)
        if: always()
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            rm -rf "$WORKSPACE"

  # ─────────────────────────────────────────
  # JOB 2 — Sécurité (cosign, gitleaks, Trivy config)
  # ─────────────────────────────────────────
  security:
    name: "② Security"
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: lint
    timeout-minutes: 10
    env:
      WORKSPACE: /volume2/docker/workspace_cyberlab/security-${{ github.run_id }}
    steps:
      - name: Nettoyage du répertoire (via démon hôte)
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            sh -c "mkdir -p '$WORKSPACE' && rm -rf '$WORKSPACE'/*"

      - name: Récupération du code
        run: |
          cd "$WORKSPACE"
          CURL_CFG=$(mktemp)
          chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.MY_GITHUB_TOKEN }}" > "$CURL_CFG"
          curl -f -L -K "$CURL_CFG" "$TARBALL_URL" -o repo.tar.gz
          rm -f "$CURL_CFG"
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Cosign — vérification image Trivy
        run: |
          docker run --rm "$COSIGN_IMAGE" verify \
            --certificate-identity-regexp "https://github.com/aquasecurity/trivy" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

      # Gate anticipé : les signatures des backends sont vérifiées ici, avant le
      # build et surtout avant la demande d'approbation "production". Les images
      # sont lues dans le compose ; l'identité attendue (dépôt, workflow ci.yml
      # sur main) est déduite du nom d'image. (?i) : le certificat garde la casse
      # du compte GitHub, GHCR force les minuscules.
      - name: Cosign — signature des images backends (GHCR)
        run: |
          IMAGES=$(grep -oE 'ghcr\.io/[^[:space:]@]+@sha256:[a-f0-9]{64}' \
            "$WORKSPACE/cyberlab/docker-compose.yml" | sort -u)
          [ -n "$IMAGES" ] || { echo "Aucune image GHCR trouvée dans le compose"; exit 1; }
          for IMG in $IMAGES; do
            REPO_PATH="${IMG%%@*}"
            REPO_PATH="${REPO_PATH#ghcr.io/}"
            echo "Vérification : $IMG"
            docker run --rm "$COSIGN_IMAGE" verify \
              --certificate-identity-regexp "(?i)^https://github.com/${REPO_PATH}/\.github/workflows/ci\.yml@refs/heads/main$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$IMG"
          done

      - name: Gitleaks — détection de secrets
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /workspace/cyberlab --no-git --redact --exit-code 1

      # Sortie tableau sur stdout (pas de SARIF) : lisible directement dans le log.
      - name: Trivy — scan IaC du compose cyberlab
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignorefile /workspace/.trivyignore \
            /workspace/cyberlab

      - name: Nettoyage final du workspace (via démon hôte)
        if: always()
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            rm -rf "$WORKSPACE"

  # ─────────────────────────────────────────
  # JOB 3 — Build de l'image Ansible + scan Trivy
  # ─────────────────────────────────────────
  # L'image embarque le repo (COPY . /app). Tag distinct par SHA pour eviter toute
  # collision entre deux runs. Sur main, l'image scannee est sauvegardee
  # (docker save) : le job Deploy attend l'approbation "production" et l'image peut
  # etre supprimee du demon hote entre-temps (nettoyage d'images du NAS) ; il la
  # recharge alors, ce qui deploie exactement l'image qui a ete scannee.
  build-scan:
    name: "③ Build & Scan"
    runs-on: self-hosted
    needs: security
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    # security-events: envoi du SARIF dans l'onglet Security (code scanning).
    permissions:
      contents: read
      security-events: write
    env:
      WORKSPACE: /volume2/docker/workspace_cyberlab/build-${{ github.run_id }}
      IMAGE: ansible-runner-cyberlab:${{ github.sha }}
      IMAGE_ARCHIVE: /volume2/docker/workspace_cyberlab/images/ansible-runner-cyberlab-${{ github.sha }}.tar.gz
    steps:
      - name: Nettoyage du répertoire (via démon hôte)
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            sh -c "mkdir -p '$WORKSPACE' && rm -rf '$WORKSPACE'/*"

      - name: Récupération du code
        run: |
          cd "$WORKSPACE"
          CURL_CFG=$(mktemp)
          chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.MY_GITHUB_TOKEN }}" > "$CURL_CFG"
          curl -f -L -K "$CURL_CFG" "$TARBALL_URL" -o repo.tar.gz
          rm -f "$CURL_CFG"
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Build image Ansible
        run: |
          cd "$WORKSPACE"
          docker build --no-cache -f ci/Dockerfile.ansible-runner -t "$IMAGE" .

      # Ecriture dans le filesystem du conteneur puis extraction via `docker cp` :
      # le SARIF reste exploitable meme si le scan echoue sur des findings
      # HIGH/CRITICAL (if: always() sur les steps suivants).
      - name: Trivy — scan image construite
        run: |
          set +e
          CID="trivy-image-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --name "$CID" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output /tmp/trivy-image.sarif \
            "$IMAGE"
          SCAN_EXIT=$?
          docker cp "$CID":/tmp/trivy-image.sarif "$WORKSPACE/trivy-image.sarif"
          docker rm "$CID" > /dev/null
          set -e
          exit $SCAN_EXIT

      # Scan informatif : toutes les severites, failles sans correctif incluses.
      # Ne bloque jamais le pipeline (le scan ci-dessus reste le seul gate) ; il
      # alimente l'onglet Security et prouve que les paquets de l'image sont lus.
      - name: Trivy — scan complet informatif (non bloquant)
        if: always()
        continue-on-error: true
        run: |
          set +e
          CID="trivy-image-full-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --name "$CID" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image \
            --exit-code 0 \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format sarif \
            --output /tmp/trivy-image-full.sarif \
            "$IMAGE"
          SCAN_EXIT=$?
          docker cp "$CID":/tmp/trivy-image-full.sarif "$WORKSPACE/trivy-image-full.sarif"
          docker rm "$CID" > /dev/null
          set -e
          exit $SCAN_EXIT

      - name: Vérifier que le rapport n'est pas vide
        if: always()
        run: |
          [ -s "$WORKSPACE/trivy-image.sarif" ] || { echo "::error::trivy-image.sarif est vide (0 octet) — l'écriture du rapport a échoué"; exit 1; }

      - name: Résumé des vulnérabilités (image)
        if: always()
        run: |
          echo "## 🔒 Rapport de sécurité — image construite" >> "$GITHUB_STEP_SUMMARY"
          f="$WORKSPACE/trivy-image.sarif"
          if [ -f "$f" ]; then
            total=$(jq '[.runs[].results[]?] | length' "$f" 2>/dev/null)
            errors=$(jq '[.runs[].results[]? | select(.level=="error")] | length' "$f" 2>/dev/null)
            total="${total:-0}"
            errors="${errors:-0}"
            if [ "$errors" -eq 0 ]; then
              echo "✅ Aucun finding critique/haut ($total au total)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**$errors** critique(s)/haute(s) sur $total findings au total" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.runs[].results[]? | select(.level=="error") | "- \(.message.text)"' "$f" 2>/dev/null \
                | head -20 >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          full="$WORKSPACE/trivy-image-full.sarif"
          if [ -s "$full" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Scan complet (informatif, toutes sévérités, sans correctif inclus)** : \
          $(jq '[.runs[].results[]?] | length' "$full") finding(s) — \
          $(jq '[.runs[].results[]? | select(.level=="error")] | length' "$full") haute/critique, \
          $(jq '[.runs[].results[]? | select(.level=="warning")] | length' "$full") moyenne, \
          $(jq '[.runs[].results[]? | select(.level=="note")] | length' "$full") basse" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload du rapport SARIF image (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report-sarif
          path: |
            ${{ env.WORKSPACE }}/trivy-image.sarif
            ${{ env.WORKSPACE }}/trivy-image-full.sarif
          retention-days: 30
          if-no-files-found: warn

      # Onglet Security > Code scanning. Non bloquant : si le code scanning n'est
      # pas disponible, le pipeline continue.
      - name: Envoi du SARIF dans l'onglet Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.WORKSPACE }}/trivy-image-full.sarif
          category: trivy-image

      # Via le demon hote (le conteneur du runner ne voit pas le meme montage).
      # Les archives de plus d'un jour (deploiements abandonnes) sont purgees.
      - name: Sauvegarde de l'image scannée (avant approbation)
        if: github.event_name != 'pull_request'
        run: |
          docker save "$IMAGE" | docker run -i --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            sh -c "mkdir -p '$(dirname "$IMAGE_ARCHIVE")' && find '$(dirname "$IMAGE_ARCHIVE")' -name '*.tar.gz' -mtime +1 -delete && gzip -1 > '$IMAGE_ARCHIVE'"

      # Sur une PR l'image n'est pas deployee ; sur main, le job Deploy la
      # reutilise (ou la recharge) : on ne la supprime qu'en cas d'echec.
      - name: Cleanup image
        if: github.event_name == 'pull_request' || failure()
        run: docker rmi "$IMAGE" || true

      - name: Nettoyage final du workspace (via démon hôte)
        if: always()
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            rm -rf "$WORKSPACE"

  # ─────────────────────────────────────────
  # JOB 4 — Deploy
  # ─────────────────────────────────────────
  deploy:
    name: "④ Deploy"
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    needs: build-scan
    environment: production
    timeout-minutes: 10
    env:
      IMAGE: ansible-runner-cyberlab:${{ github.sha }}
      IMAGE_ARCHIVE: /volume2/docker/workspace_cyberlab/images/ansible-runner-cyberlab-${{ github.sha }}.tar.gz
    steps:
      # L'image peut avoir ete supprimee pendant l'attente de l'approbation.
      - name: Recharger l'image scannée si elle a disparu
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image presente sur le demon hote."
          else
            echo "Image absente : rechargement depuis l'archive."
            docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
              gzip -dc "$IMAGE_ARCHIVE" | docker load
          fi

      - name: Exécution du playbook cyberlab
        run: |
          docker run --rm \
            -e ANSIBLE_FORCE_COLOR=1 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /volume2/docker:/volume2/docker \
            "$IMAGE" \
            ansible-playbook \
              -i ansible/inventory/hosts.ini \
              ansible/playbooks/deploy-cyberlab.yml

      - name: Cleanup image et archive
        if: always()
        run: |
          docker rmi "$IMAGE" || true
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            rm -f "$IMAGE_ARCHIVE"

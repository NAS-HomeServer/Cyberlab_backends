---
- name: "IaC - Deploiement des backends cyberlab (sherlock / dns_analyzer / audit_orchestrator + cloudflared)"
  hosts: localhost
  connection: local
  vars:
    cyberlab_project_dir: "/volume2/docker/cyberlab"
    repo_root: "{{ playbook_dir }}/../.."
    cosign_image: "gcr.io/projectsigstore/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8"
    backends: [sherlock, dns-analyzer, audit-orchestrator]
    tunnels: [cloudflared-sherlock, cloudflared-dns, cloudflared-audit]
    compose: "{{ lookup('ansible.builtin.file', repo_root ~ '/cyberlab/docker-compose.yml') | from_yaml }}"
    signed_images: "{{ backends | map('extract', compose.services, 'image') | list }}"
    cloudflared_images: "{{ tunnels | map('extract', compose.services, 'image') | unique | list }}"

  tasks:
    - name: "Verification de la signature Cosign des images backends"
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - "{{ cosign_image }}"
          - verify
          - --certificate-identity-regexp
          - "(?i)^https://github.com/{{ item.split('@')[0].split('/')[1:] | join('/') }}/\\.github/workflows/ci\\.yml@refs/heads/main$"
          - --certificate-oidc-issuer
          - "https://token.actions.githubusercontent.com"
          - "{{ item }}"
      loop: "{{ signed_images }}"
      changed_when: false

    - name: "Deploiement du compose cyberlab"
      ansible.builtin.copy:
        src: "{{ repo_root }}/cyberlab/docker-compose.yml"
        dest: "{{ cyberlab_project_dir }}/docker-compose.yml"
        mode: '0644'

    - name: "Gestion de la stack Docker Compose cyberlab"
      community.docker.docker_compose_v2:
        project_src: "{{ cyberlab_project_dir }}"
        project_name: "cyberlab"
        state: present
        pull: missing
        remove_orphans: false
      environment:
        DOCKER_API_VERSION: "1.43"

    - name: "Tag local 'deployed' sur les images backends (lisibilite Portainer)"
      ansible.builtin.command:
        argv:
          - docker
          - tag
          - "{{ item }}"
          - "{{ item.split('@')[0] }}:deployed"
      loop: "{{ signed_images }}"
      changed_when: false
      environment:
        DOCKER_API_VERSION: "1.43"

    - name: "Tag local de version sur les images cloudflared (lisibilite Portainer)"
      ansible.builtin.command:
        argv:
          - docker
          - tag
          - "{{ item }}"
          - "{{ item.split('@')[0] }}"
      loop: "{{ cloudflared_images }}"
      changed_when: false
      environment:
        DOCKER_API_VERSION: "1.43"

    # Verification apres deploiement : un playbook sans erreur ne prouve pas que
    # les services tournent. On attend jusqu'a 60 s que chaque conteneur soit
    # demarre, sans redemarrage en boucle, et sain quand il declare un healthcheck.
    - name: "Verification : conteneurs demarres et sains"
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{json .State}}' }}"
          - "{{ compose.services[item].container_name }}"
      register: container_state
      until:
        - container_state.rc == 0
        - (container_state.stdout | from_json).Running
        - not (container_state.stdout | from_json).Restarting
        - (container_state.stdout | from_json).get('Health', {}).get('Status', 'healthy') == 'healthy'
      retries: 12
      delay: 5
      changed_when: false
      loop: "{{ backends + tunnels }}"
      environment:
        DOCKER_API_VERSION: "1.43"

    # cloudflared n'a pas de healthcheck : on verifie dans ses logs qu'au moins
    # une connexion au reseau Cloudflare est enregistree.
    - name: "Verification : tunnels cloudflared connectes a Cloudflare"
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - "{{ compose.services[item].container_name }}"
      register: tunnel_logs
      until: "'Registered tunnel connection' in (tunnel_logs.stdout ~ tunnel_logs.stderr)"
      retries: 12
      delay: 5
      changed_when: false
      loop: "{{ tunnels }}"
      environment:
        DOCKER_API_VERSION: "1.43"
